services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2}
    container_name: immich_server
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      disable: false
    networks:
      - media_backend
      - shared_backend

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2}
    container_name: immich_machine_learning
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false
    networks:
      - media_backend

  redis:
    image: docker.io/valkey/valkey:9
    container_name: immich_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - media_backend

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    shm_size: 128mb
    healthcheck:
      disable: false
    networks:
      - media_backend

  couchdb:
    image: couchdb:3.5.1
    container_name: couchdb
    user: "5984:5984"
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-carlos}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://${COUCHDB_USER:-carlos}:${COUCHDB_PASSWORD}@127.0.0.1:5984/_up >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - media_backend
      - shared_backend

  nextcloud-db:
    image: mariadb:11.4
    container_name: nextcloud_mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${NEXTCLOUD_DB_NAME:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nextcloud_backend

  nextcloud-redis:
    image: docker.io/valkey/valkey:9
    container_name: nextcloud_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - nextcloud_backend

  nextcloud:
    image: nextcloud:${NEXTCLOUD_VERSION:-34-apache}
    container_name: nextcloud_app
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${NEXTCLOUD_DB_NAME:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      MYSQL_HOST: nextcloud-db
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-cloud.carlosjg.space}
      REDIS_HOST: nextcloud-redis
      PHP_MEMORY_LIMIT: ${NEXTCLOUD_PHP_MEMORY_LIMIT:-512M}
      PHP_UPLOAD_LIMIT: ${NEXTCLOUD_UPLOAD_LIMIT:-4G}
      APACHE_BODY_LIMIT: "0"
      NEXTCLOUD_INIT_HTACCESS: "true"
    volumes:
      - nextcloud-html:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -f /var/www/html/occ status --output=json | grep -q '\"installed\":true'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - nextcloud_backend

  nextcloud-cron:
    image: nextcloud:${NEXTCLOUD_VERSION:-34-apache}
    container_name: nextcloud_cron
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      nextcloud:
        condition: service_started
    volumes:
      - nextcloud-html:/var/www/html
    networks:
      - nextcloud_backend

  bitwarden-db:
    image: mariadb:11.4
    container_name: bitwarden_mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bitwarden_vault
      MARIADB_USER: bitwarden
      MARIADB_PASSWORD: ${BITWARDEN_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -ubitwarden -p\"$$MARIADB_PASSWORD\" --silent"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bitwarden_backend

  bitwarden:
    image: ghcr.io/bitwarden/lite:${BITWARDEN_VERSION:-latest}
    container_name: bitwarden
    restart: unless-stopped
    depends_on:
      bitwarden-db:
        condition: service_healthy
    environment:
      BW_DOMAIN: ${BITWARDEN_DOMAIN:-vault.carlosjg.space}
      BW_DB_PROVIDER: mariadb
      BW_DB_SERVER: bitwarden-db
      BW_DB_DATABASE: bitwarden_vault
      BW_DB_USERNAME: bitwarden
      BW_DB_PASSWORD: ${BITWARDEN_DB_PASSWORD}
      BW_INSTALLATION_ID: ${BITWARDEN_INSTALLATION_ID}
      BW_INSTALLATION_KEY: ${BITWARDEN_INSTALLATION_KEY}
      BW_PORT_HTTP: "8080"
      BW_REAL_IPS: 172.31.0.2
      globalSettings__disableUserRegistration: ${BITWARDEN_DISABLE_USER_REGISTRATION:-false}
      globalSettings__mail__replyToEmail: ${BITWARDEN_SMTP_FROM_EMAIL:-vault@carlosjg.space}
      globalSettings__mail__smtp__host: smtp.resend.com
      globalSettings__mail__smtp__port: "465"
      globalSettings__mail__smtp__ssl: "true"
      globalSettings__mail__smtp__username: resend
      globalSettings__mail__smtp__password: ${BITWARDEN_SMTP_PASSWORD}
    volumes:
      - bitwarden-data:/etc/bitwarden
    networks:
      - bitwarden_backend

  infisical-db:
    image: postgres:16-alpine
    container_name: infisical_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD}
      POSTGRES_DB: infisical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=infisical --dbname=infisical"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - infisical_backend

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - infisical_backend

  infisical:
    image: infisical/infisical:${INFISICAL_VERSION:-v0.160.7}
    container_name: infisical
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      DB_CONNECTION_URI: "postgres://infisical:${INFISICAL_DB_PASSWORD}@infisical-db:5432/infisical"
      REDIS_URL: redis://infisical-redis:6379
      SITE_URL: ${INFISICAL_SITE_URL:-https://secrets.carlosjg.space}
      HOST: 0.0.0.0
      TRUSTED_PROXY_CIDRS: 172.32.0.2/32
      TELEMETRY_ENABLED: "false"
    networks:
      - infisical_backend

  nginx:
    image: nginx:1.28.3-alpine
    container_name: media_nginx
    restart: unless-stopped
    depends_on:
      immich-server:
        condition: service_started
      couchdb:
        condition: service_healthy
      nextcloud:
        condition: service_started
      bitwarden:
        condition: service_started
      infisical:
        condition: service_started
    volumes:
      - ../../configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../configs/nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      media_backend: {}
      shared_backend: {}
      nextcloud_backend:
        ipv4_address: 172.30.0.2
      bitwarden_backend:
        ipv4_address: 172.31.0.2
      infisical_backend:
        ipv4_address: 172.32.0.2

volumes:
  model-cache:
  nextcloud-html:
  bitwarden-data:

networks:
  media_backend:
    driver: bridge
  shared_backend:
    name: infra_shared_backend
    external: true
  nextcloud_backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  bitwarden_backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  infisical_backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.32.0.0/24
