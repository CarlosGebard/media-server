services:
  immich-server:
    ports:
      - "127.0.0.1:${IMMICH_HTTP_PORT:-2283}:2283"
    volumes:
      - ${UPLOAD_LOCATION:-/srv/data/media/immich/app}:/data
      - /etc/localtime:/etc/localtime:ro

  database:
    volumes:
      - ${DB_DATA_LOCATION:-/srv/data/media/immich/postgres}:/var/lib/postgresql/data

  couchdb:
    ports:
      - "127.0.0.1:${COUCHDB_HTTP_PORT:-5984}:5984"
    volumes:
      - ${COUCHDB_DATA_LOCATION:-/srv/data/media/couchdb/data}:/opt/couchdb/data
      - ${MEDIA_APP_ROOT:-/srv/apps/media}/couchdb/local.d/local.ini:/opt/couchdb/etc/local.d/local.ini:ro

  nextcloud-db:
    volumes:
      - ${NEXTCLOUD_DB_DATA_LOCATION:-/srv/data/media/nextcloud/mariadb}:/var/lib/mysql

  nextcloud:
    ports:
      - "127.0.0.1:${NEXTCLOUD_HTTP_PORT:-8081}:80"
    environment:
      APACHE_DISABLE_REWRITE_IP: "1"
      TRUSTED_PROXIES: ${NEXTCLOUD_TRUSTED_PROXIES:-172.30.0.0/24}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: ${NEXTCLOUD_OVERWRITE_CLI_URL}
    volumes:
      - ${NEXTCLOUD_HTML_DATA_LOCATION:-/srv/data/media/nextcloud/html}:/var/www/html

  nextcloud-cron:
    volumes:
      - ${NEXTCLOUD_HTML_DATA_LOCATION:-/srv/data/media/nextcloud/html}:/var/www/html

  bitwarden-db:
    volumes:
      - ${BITWARDEN_DB_DATA_LOCATION:-/srv/data/media/bitwarden/mariadb}:/var/lib/mysql

  bitwarden:
    ports:
      - "127.0.0.1:${BITWARDEN_HTTP_PORT:-8082}:8080"
    environment:
      BW_DOMAIN: ${BITWARDEN_DOMAIN:-raspberry-media-server.tail116b62.ts.net:8446}
    volumes:
      - ${BITWARDEN_DATA_LOCATION:-/srv/data/media/bitwarden/data}:/etc/bitwarden

  nginx:
    profiles:
      - legacy-private-edge
