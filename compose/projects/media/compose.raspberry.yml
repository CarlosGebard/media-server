services:
  immich-server:
    ports:
      - "127.0.0.1:${IMMICH_HTTP_PORT:-2283}:2283"
    volumes:
      - ${UPLOAD_LOCATION:-/srv/data/media/immich/app}:/data
      - /etc/localtime:/etc/localtime:ro

  database:
    volumes:
      - ${DB_DATA_LOCATION:-/srv/data/media/immich/postgres}:/var/lib/postgresql/data

  couchdb:
    volumes:
      - ${COUCHDB_DATA_LOCATION:-/srv/data/media/couchdb/data}:/opt/couchdb/data
      - ${MEDIA_APP_ROOT:-/srv/apps/media}/couchdb/local.d/local.ini:/opt/couchdb/etc/local.d/local.ini:ro

  nextcloud-db:
    volumes:
      - ${NEXTCLOUD_DB_DATA_LOCATION:-/srv/data/media/nextcloud/mariadb}:/var/lib/mysql

  nextcloud:
    environment:
      APACHE_DISABLE_REWRITE_IP: "1"
      TRUSTED_PROXIES: ${NEXTCLOUD_TRUSTED_PROXIES:-172.30.0.0/24}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: ${NEXTCLOUD_OVERWRITE_CLI_URL}
    volumes:
      - ${NEXTCLOUD_HTML_DATA_LOCATION:-/srv/data/media/nextcloud/html}:/var/www/html

  nextcloud-cron:
    volumes:
      - ${NEXTCLOUD_HTML_DATA_LOCATION:-/srv/data/media/nextcloud/html}:/var/www/html

  bitwarden-db:
    volumes:
      - ${BITWARDEN_DB_DATA_LOCATION:-/srv/data/media/bitwarden/mariadb}:/var/lib/mysql

  bitwarden:
    volumes:
      - ${BITWARDEN_DATA_LOCATION:-/srv/data/media/bitwarden/data}:/etc/bitwarden

  nginx:
    ports:
      - "${TAILSCALE_BIND_IP:?Set TAILSCALE_BIND_IP to tailscale ip -4}:443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/healthz >/dev/null"]
    volumes:
      - ${MEDIA_APP_ROOT:-/srv/apps/media}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MEDIA_APP_ROOT:-/srv/apps/media}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${PRIVATE_TLS_CERT_PATH:-/srv/secrets/tls/home.carlosjg/fullchain.pem}:/etc/nginx/private-tls/fullchain.pem:ro
      - ${PRIVATE_TLS_KEY_PATH:-/srv/secrets/tls/home.carlosjg/privkey.pem}:/etc/nginx/private-tls/privkey.pem:ro
