server {
  listen 80 default_server;
  server_name immich.carlosjg.space;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $upstream immich-server:2283;
    proxy_pass http://$upstream;
  }
}

server {
  listen 5984;
  server_name couchdb.carlosjg.space;

  location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $upstream couchdb:5984;
    proxy_pass http://$upstream;
    proxy_redirect off;
    proxy_buffering off;
  }
}

server {
  listen 8081;
  server_name cloud.carlosjg.space;

  client_max_body_size 0;
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

  location = /.well-known/carddav {
    return 301 /remote.php/dav;
  }

  location = /.well-known/caldav {
    return 301 /remote.php/dav;
  }

  location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $upstream nextcloud:80;
    proxy_pass http://$upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}

server {
  listen 8082;
  server_name vault.carlosjg.space;

  location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream bitwarden:8080;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
