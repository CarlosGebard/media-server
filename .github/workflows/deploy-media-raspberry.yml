name: Deploy Media to Raspberry Pi

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: true
        default: main

concurrency:
  group: personal-media-raspberry-deploy
  cancel-in-progress: false

env:
  DEPLOY_GIT_REF: ${{ inputs.git_ref || github.sha }}

jobs:
  deploy:
    name: Deploy private media stack
    runs-on: [self-hosted, linux, arm64, media]
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Pull global deployment secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: oidc
          domain: ${{ vars.INFISICAL_API_URL }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /global

      - name: Pull Nextcloud secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: oidc
          domain: ${{ vars.INFISICAL_API_URL }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /nextcloud

      - name: Pull Bitwarden secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: oidc
          domain: ${{ vars.INFISICAL_API_URL }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /bitwarden

      - name: Assert Raspberry deployment prerequisites
        run: |
          set -euo pipefail
          command -v ansible-playbook >/dev/null
          command -v docker >/dev/null
          command -v tailscale >/dev/null
          test -n "$(tailscale ip -4)"

      - name: Materialize Raspberry media runtime env
        env:
          IMMICH_VERSION: ${{ env.IMMICH_VERSION }}
          IMMICH_DB_PASSWORD: ${{ env.IMMICH_DB_PASSWORD }}
          COUCHDB_PASSWORD: ${{ env.COUCHDB_PASSWORD }}
          NEXTCLOUD_ADMIN_PASSWORD: ${{ env.NEXTCLOUD_ADMIN_PASSWORD }}
          NEXTCLOUD_DB_PASSWORD: ${{ env.NEXTCLOUD_DB_PASSWORD }}
          NEXTCLOUD_DB_ROOT_PASSWORD: ${{ env.NEXTCLOUD_DB_ROOT_PASSWORD }}
          BITWARDEN_DB_PASSWORD: ${{ env.BITWARDEN_DB_PASSWORD }}
          BITWARDEN_INSTALLATION_ID: ${{ env.BITWARDEN_INSTALLATION_ID }}
          BITWARDEN_INSTALLATION_KEY: ${{ env.BITWARDEN_INSTALLATION_KEY }}
          BITWARDEN_SMTP_PASSWORD: ${{ env.BITWARDEN_SMTP_PASSWORD }}
          BITWARDEN_DISABLE_USER_REGISTRATION: ${{ env.BITWARDEN_DISABLE_USER_REGISTRATION }}
        run: |
          set -euo pipefail
          : "${IMMICH_DB_PASSWORD:?Missing IMMICH_DB_PASSWORD}"
          : "${COUCHDB_PASSWORD:?Missing COUCHDB_PASSWORD}"
          : "${NEXTCLOUD_ADMIN_PASSWORD:?Missing NEXTCLOUD_ADMIN_PASSWORD}"
          : "${NEXTCLOUD_DB_PASSWORD:?Missing NEXTCLOUD_DB_PASSWORD}"
          : "${NEXTCLOUD_DB_ROOT_PASSWORD:?Missing NEXTCLOUD_DB_ROOT_PASSWORD}"
          : "${BITWARDEN_DB_PASSWORD:?Missing BITWARDEN_DB_PASSWORD}"
          : "${BITWARDEN_INSTALLATION_ID:?Missing BITWARDEN_INSTALLATION_ID}"
          : "${BITWARDEN_INSTALLATION_KEY:?Missing BITWARDEN_INSTALLATION_KEY}"
          : "${BITWARDEN_SMTP_PASSWORD:?Missing BITWARDEN_SMTP_PASSWORD}"
          tailscale_ip="$(tailscale ip -4)"
          quote_env() { local value="$1"; value="${value//\'/\\\'}"; printf "'%s'" "$value"; }
          {
            printf 'IMMICH_VERSION=%s\n' "$(quote_env "${IMMICH_VERSION:-v2}")"
            printf 'UPLOAD_LOCATION=%s\n' "$(quote_env '/srv/data/media/immich/app')"
            printf 'DB_DATA_LOCATION=%s\n' "$(quote_env '/srv/data/media/immich/postgres')"
            printf 'IMMICH_DB_PASSWORD=%s\n' "$(quote_env "$IMMICH_DB_PASSWORD")"
            printf 'DB_USERNAME=%s\n' "$(quote_env postgres)"
            printf 'DB_DATABASE_NAME=%s\n' "$(quote_env immich)"
            printf 'COUCHDB_USER=%s\n' "$(quote_env carlos)"
            printf 'COUCHDB_PASSWORD=%s\n' "$(quote_env "$COUCHDB_PASSWORD")"
            printf 'COUCHDB_DATA_LOCATION=%s\n' "$(quote_env '/srv/data/media/couchdb/data')"
            printf 'NEXTCLOUD_VERSION=%s\n' "$(quote_env "${NEXTCLOUD_VERSION:-34-apache}")"
            printf 'NEXTCLOUD_DB_NAME=%s\n' "$(quote_env nextcloud)"
            printf 'NEXTCLOUD_DB_USER=%s\n' "$(quote_env nextcloud)"
            printf 'NEXTCLOUD_DB_PASSWORD=%s\n' "$(quote_env "$NEXTCLOUD_DB_PASSWORD")"
            printf 'NEXTCLOUD_DB_ROOT_PASSWORD=%s\n' "$(quote_env "$NEXTCLOUD_DB_ROOT_PASSWORD")"
            printf 'NEXTCLOUD_ADMIN_USER=%s\n' "$(quote_env admin)"
            printf 'NEXTCLOUD_ADMIN_PASSWORD=%s\n' "$(quote_env "$NEXTCLOUD_ADMIN_PASSWORD")"
            printf 'NEXTCLOUD_TRUSTED_DOMAINS=%s\n' "$(quote_env 'cloud.home.carlosjg.space')"
            printf 'NEXTCLOUD_TRUSTED_PROXIES=%s\n' "$(quote_env '172.30.0.0/24')"
            printf 'NEXTCLOUD_OVERWRITE_CLI_URL=%s\n' "$(quote_env 'https://cloud.home.carlosjg.space')"
            printf 'NEXTCLOUD_HTML_DATA_LOCATION=%s\n' "$(quote_env '/srv/data/media/nextcloud/html')"
            printf 'NEXTCLOUD_DB_DATA_LOCATION=%s\n' "$(quote_env '/srv/data/media/nextcloud/mariadb')"
            printf 'BITWARDEN_VERSION=%s\n' "$(quote_env latest)"
            printf 'BITWARDEN_DOMAIN=%s\n' "$(quote_env 'vault.home.carlosjg.space')"
            printf 'BITWARDEN_DB_PASSWORD=%s\n' "$(quote_env "$BITWARDEN_DB_PASSWORD")"
            printf 'BITWARDEN_INSTALLATION_ID=%s\n' "$(quote_env "$BITWARDEN_INSTALLATION_ID")"
            printf 'BITWARDEN_INSTALLATION_KEY=%s\n' "$(quote_env "$BITWARDEN_INSTALLATION_KEY")"
            printf 'BITWARDEN_SMTP_PASSWORD=%s\n' "$(quote_env "$BITWARDEN_SMTP_PASSWORD")"
            printf 'BITWARDEN_DISABLE_USER_REGISTRATION=%s\n' "$(quote_env "${BITWARDEN_DISABLE_USER_REGISTRATION:-false}")"
            printf 'BITWARDEN_DB_DATA_LOCATION=%s\n' "$(quote_env '/srv/data/media/bitwarden/mariadb')"
            printf 'BITWARDEN_DATA_LOCATION=%s\n' "$(quote_env '/srv/data/media/bitwarden/data')"
            printf 'TAILSCALE_BIND_IP=%s\n' "$(quote_env "$tailscale_ip")"
            printf 'PRIVATE_TLS_CERT_PATH=%s\n' "$(quote_env '/srv/secrets/tls/home.carlosjg.space/fullchain.pem')"
            printf 'PRIVATE_TLS_KEY_PATH=%s\n' "$(quote_env '/srv/secrets/tls/home.carlosjg.space/privkey.pem')"
            printf 'MEDIA_APP_ROOT=%s\n' "$(quote_env '/srv/apps/media')"
            printf 'TZ=%s\n' "$(quote_env 'America/Santiago')"
          } > /tmp/media-raspberry-runtime.env
          chmod 600 /tmp/media-raspberry-runtime.env

      - name: Deploy private media stack
        env:
          MEDIA_RUNTIME_ENV_SOURCE_FILE: /tmp/media-raspberry-runtime.env
        run: |
          set -euo pipefail
          cd ansible
          ansible-playbook -i inventories/raspberry/hosts.yml playbooks/deploy-media.yml
